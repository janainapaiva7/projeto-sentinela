<!DOCTYPE html> <html lang="pt-BR"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sistema Hospitalar - TV</title>

<style>

    /* =====================================================
       CONFIGURAÇÕES GERAIS
    ===================================================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #071f32 0%,
                #0b3449 45%,
                #063d45 100%
            );

        color: white;

        overflow: hidden;
    }

    /* =====================================================
       FUNDO DECORATIVO
    ===================================================== */

    body::before {

        content: "";

        position: fixed;

        width: 600px;
        height: 600px;

        top: -300px;
        right: -200px;

        border-radius: 50%;

        background:
            rgba(14, 190, 184, 0.12);

        pointer-events: none;
    }

    body::after {

        content: "";

        position: fixed;

        width: 500px;
        height: 500px;

        bottom: -300px;
        left: -200px;

        border-radius: 50%;

        background:
            rgba(35, 140, 220, 0.10);

        pointer-events: none;
    }

    /* =====================================================
       CONTAINER DA TV
    ===================================================== */

    .tv-container {

        position: relative;
        z-index: 1;

        display: grid;

        grid-template-columns:
            32% 68%;

        gap: 18px;

        width: 96vw;
        height: 94vh;

        margin: 3vh auto;
    }

    /* =====================================================
       PAINÉIS
    ===================================================== */

    .left-panel,
    .right-panel {

        display: flex;

        flex-direction: column;

        gap: 18px;

        min-width: 0;
    }

    /* =====================================================
       CAIXAS
    ===================================================== */

    .box {

        position: relative;

        overflow: hidden;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-align: center;

        background:
            linear-gradient(
                145deg,
                #ffffff,
                #f1f8fb
            );

        border: 1px solid
            rgba(255, 255, 255, 0.8);

        border-radius: 20px;

        box-shadow:
            0 15px 40px
            rgba(0, 0, 0, 0.25);

        color: #163b52;
    }

    /* =====================================================
       LINHA DECORATIVA
    ===================================================== */

    .box::before {

        content: "";

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 6px;

        background:
            linear-gradient(
                90deg,
                #08aaa5,
                #1789d4
            );
    }

    /* =====================================================
       TÍTULOS
    ===================================================== */

    .box-title {

        color: #587381;

        font-size: clamp(
            16px,
            1.7vw,
            28px
        );

        font-weight: 800;

        letter-spacing: 2px;

        text-transform: uppercase;

        margin-bottom: 12px;
    }

    /* =====================================================
       PAINEL DO LOCAL
    ===================================================== */

    .local-box {

        flex: 1;

        padding: 25px;
    }

    .local-box .box-title {

        color: #168b91;

        font-size: clamp(
            18px,
            2vw,
            30px
        );
    }

    .local-number {

        color: #147fc4;

        font-size: clamp(
            80px,
            10vw,
            180px
        );

        font-weight: 900;

        line-height: 0.95;

        text-shadow:
            0 5px 15px
            rgba(20, 127, 196, 0.15);
    }

    .local-type {

        margin-top: 12px;

        color: #617985;

        font-size: clamp(
            15px,
            1.5vw,
            24px
        );

        font-weight: bold;

        text-transform: uppercase;
    }

    /* =====================================================
       HISTÓRICO
    ===================================================== */

    .history-box {

        flex: 1;

        align-items: stretch;

        justify-content: flex-start;

        padding: 25px;
    }

    .history-box .box-title {

        align-self: center;

        margin-bottom: 20px;

        color: #168b91;
    }

    #history-list {

        width: 100%;

        list-style: none;
    }

    #history-list li {

        display: flex;

        align-items: center;

        gap: 10px;

        width: 100%;

        padding: 11px 12px;

        margin-bottom: 9px;

        border-radius: 9px;

        background: #edf6f8;

        border-left: 4px solid #0ca5a5;

        color: #31576a;

        font-size: clamp(
            13px,
            1.2vw,
            19px
        );

        font-weight: bold;

        text-align: left;
    }

    #history-list li::before {

        content: "✓";

        color: #0ca5a5;

        font-weight: 900;
    }

    /* =====================================================
       PAINEL DO PACIENTE
    ===================================================== */

    .patient-box {

        flex: 3;

        padding: 30px;
    }

    .patient-box .box-title {

        color: #168b91;

        font-size: clamp(
            18px,
            2vw,
            32px
        );

        margin-bottom: 25px;
    }

    .patient-name {

        max-width: 95%;

        color: #c62828;

        font-size: clamp(
            50px,
            6.5vw,
            125px
        );

        font-weight: 900;

        line-height: 1.05;

        text-transform: uppercase;

        overflow-wrap: anywhere;

        text-shadow:
            0 5px 15px
            rgba(198, 40, 40, 0.12);
    }

    /* =====================================================
       MENSAGEM DE AGUARDE
    ===================================================== */

    .patient-name:empty {

        display: none;
    }

    /* =====================================================
       LOGO
    ===================================================== */

    .logo-box {

        flex: 1;

        flex-direction: row;

        gap: 15px;

        padding: 20px;
    }

    .logo-icon {

        width: 55px;
        height: 55px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 15px;

        background:
            linear-gradient(
                135deg,
                #08aaa5,
                #1789d4
            );

        font-size: 28px;

        box-shadow:
            0 8px 20px
            rgba(20, 127, 208, 0.18);
    }

    .logo-text {

        color: #244d67;

        font-size: clamp(
            22px,
            2.5vw,
            42px
        );

        font-weight: 900;

        text-transform: uppercase;
    }

    .logo-subtitle {

        color: #7b909c;

        font-size: clamp(
            10px,
            1vw,
            16px
        );

        margin-top: 4px;

        text-transform: uppercase;

        letter-spacing: 1px;
    }

    /* =====================================================
       ANIMAÇÃO DE NOVA CHAMADA
    ===================================================== */

    @keyframes chamada {

        0% {
            transform: scale(1);
            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }

        25% {
            transform: scale(1.015);
            box-shadow:
                0 0 0 8px
                rgba(198, 40, 40, 0.15),
                0 20px 50px
                rgba(198, 40, 40, 0.25);
        }

        50% {
            transform: scale(1);
        }

        75% {
            transform: scale(1.015);
            box-shadow:
                0 0 0 8px
                rgba(198, 40, 40, 0.15),
                0 20px 50px
                rgba(198, 40, 40, 0.25);
        }

        100% {
            transform: scale(1);
        }
    }

    .flash {

        animation:
            chamada 0.7s ease-in-out 3;
    }

    /* =====================================================
       RESPONSIVIDADE
    ===================================================== */

    @media (max-width: 900px) {

        .tv-container {

            grid-template-columns:
                1fr 1.8fr;

            gap: 10px;

            width: 98vw;

            height: 96vh;

            margin: 2vh auto;
        }

        .left-panel,
        .right-panel {

            gap: 10px;
        }

        .box {

            border-radius: 14px;
        }

        .local-box,
        .history-box,
        .patient-box,
        .logo-box {

            padding: 15px;
        }

    }

</style>

</head> <body>
<!-- =====================================================
     TELA PRINCIPAL
===================================================== -->

<main class="tv-container">

    <!-- =================================================
         PAINEL ESQUERDO
    ================================================== -->

    <section class="left-panel">

        <!-- =============================================
             LOCAL
        ============================================== -->

        <div class="box local-box">

            <div
                class="box-title"
                id="local-tipo"
            >
                GUICHÊ
            </div>

            <div
                class="local-number"
                id="local-numero"
            >
                --
            </div>

            <div class="local-type">
                LOCAL DE ATENDIMENTO
            </div>

        </div>

        <!-- =============================================
             HISTÓRICO
        ============================================== -->

        <div class="box history-box">

            <div class="box-title">
                Últimas chamadas
            </div>

            <ul id="history-list"></ul>

        </div>

    </section>

    <!-- =================================================
         PAINEL DIREITO
    ================================================== -->

    <section class="right-panel">

        <!-- =============================================
             PACIENTE
        ============================================== -->

        <div class="box patient-box">

            <div class="box-title">
                Paciente
            </div>

            <div
                class="patient-name"
                id="patient-name"
            >
                AGUARDANDO...
            </div>

        </div>

        <!-- =============================================
             LOGO
        ============================================== -->

        <div class="box logo-box">

            <div class="logo-icon">
                🏥
            </div>

            <div>

                <div class="logo-text">
                    Sistema Hospitalar
                </div>

                <div class="logo-subtitle">
                    Painel de atendimento
                </div>

            </div>

        </div>

    </section>

</main>

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

    /* ==================================================
       CONTROLE DA ÚLTIMA CHAMADA
    ================================================== */

    let ultimoId = null;

    /* ==================================================
       ATUALIZAR TELA
    ================================================== */

    function atualizar() {

        fetch("/tv/chamada")

            .then(function(response) {

                return response.json();

            })

            .then(function(data) {

                /* ------------------------------------------
                   DADOS
                ------------------------------------------ */

                const chamada =
                    data.chamada;

                const historico =
                    data.historico || [];

                /* ------------------------------------------
                   CHAMADA ATUAL
                ------------------------------------------ */

                if (chamada) {

                    document.getElementById(
                        "local-tipo"
                    ).innerText =
                        chamada.localTipo ||
                        "GUICHÊ";

                    document.getElementById(
                        "local-numero"
                    ).innerText =
                        chamada.localNumero ||
                        "--";

                    document.getElementById(
                        "patient-name"
                    ).innerText =
                        chamada.paciente ||
                        "AGUARDANDO...";

                    /* --------------------------------------
                       NOVA CHAMADA
                    -------------------------------------- */

                    if (
                        chamada.id !==
                        ultimoId
                    ) {

                        ultimoId =
                            chamada.id;

                        const patientBox =
                            document.querySelector(
                                ".patient-box"
                            );

                        patientBox.classList.remove(
                            "flash"
                        );

                        void patientBox.offsetWidth;

                        patientBox.classList.add(
                            "flash"
                        );

                    }

                }

                /* ------------------------------------------
                   HISTÓRICO
                ------------------------------------------ */

                const lista =
                    document.getElementById(
                        "history-list"
                    );

                lista.innerHTML = "";

                historico
                    .slice(0, 4)
                    .forEach(function(item) {

                        const li =
                            document.createElement(
                                "li"
                            );

                        const tipo =
                            item.localTipo
                                ? item.localTipo.substring(
                                    0,
                                    4
                                )
                                : "GUIC";

                        li.innerText =
                            tipo +
                            ". " +
                            (
                                item.localNumero ||
                                "--"
                            ) +
                            " - " +
                            (
                                item.paciente ||
                                "Paciente"
                            );

                        lista.appendChild(li);

                    });

            })

            .catch(function(error) {

                console.log(
                    "Erro ao buscar chamada:",
                    error
                );

            });

    }

    /* ==================================================
       PRIMEIRA ATUALIZAÇÃO
    ================================================== */

    atualizar();

    /* ==================================================
       ATUALIZA A CADA 2 SEGUNDOS
    ================================================== */

    setInterval(
        atualizar,
        2000
    );

</script>

</body> </html>
