<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <!-- CABEÇALHO -->

  <div class="painel-header">

    <h2 class="painel-titulo">
      🩺 Painel Médico
    </h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir Tela da TV
    </button>

  </div>


  <!-- CONSULTÓRIO -->

  <div class="consultorio-input">

    <label>
      Meu Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span class="consultorio-info">
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <!-- TRIAGENS -->

  <div id="triagens"></div>

  <hr>


  <!-- CONSULTA -->

  <h3>
    Consulta
  </h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >

  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >

  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>

  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>

  <button onclick="salvar()">
    Salvar
  </button>

</div>


<!-- MODAL DE ALTA -->

<div
  id="modalAlta"
  class="modal-alta"
>

  <div class="caixa-alta">

    <h2>
      🏥 Dar Alta ao Paciente
    </h2>


    <!-- PACIENTE -->

    <div class="campo-alta">

      <label>
        Paciente
      </label>

      <input
        type="text"
        id="altaPaciente"
        readonly
      >

    </div>


    <!-- DIAGNÓSTICO -->

    <div class="campo-alta">

      <label>
        Diagnóstico
      </label>

      <input
        type="text"
        id="altaDiagnostico"
        readonly
      >

    </div>


    <!-- MOTIVO DA ALTA -->

    <div class="campo-alta">

      <label>
        Motivo da Alta *
      </label>

      <textarea
        id="motivoAlta"
        rows="5"
        placeholder="Informe o motivo da alta..."
      ></textarea>

    </div>


    <!-- OBSERVAÇÕES -->

    <div class="campo-alta">

      <label>
        Observações
      </label>

      <textarea
        id="observacoesAlta"
        rows="4"
        placeholder="Digite observações adicionais..."
      ></textarea>

    </div>


    <!-- DATA -->

    <div class="campo-alta">

      <label>
        Data da Alta *
      </label>

      <input
        type="date"
        id="dataAlta"
      >

    </div>


    <!-- BOTÕES -->

    <div class="botoes-alta">

      <button
        type="button"
        class="btn-gerar-alta"
        onclick="gerarAltaPDF()"
      >
        📄 Gerar PDF
      </button>

      <button
        type="button"
        class="btn-cancelar-alta"
        onclick="fecharFormularioAlta()"
      >
        Cancelar
      </button>

    </div>

  </div>

</div>


<!-- DOCUMENTO DA ALTA -->

<div id="documentoAlta">

  <div class="cabecalho-pdf">

    <h1>
      DOCUMENTO DE ALTA
    </h1>

    <p>
      Relatório de Alta do Paciente
    </p>

  </div>


  <p>

    <strong>
      Paciente:
    </strong>

    <span id="pdfPaciente"></span>

  </p>


  <p>

    <strong>
      Diagnóstico:
    </strong>

    <span id="pdfDiagnostico"></span>

  </p>


  <p>

    <strong>
      Data da Alta:
    </strong>

    <span id="pdfData"></span>

  </p>


  <hr>


  <h3>
    Motivo da Alta
  </h3>

  <p id="pdfMotivo"></p>


  <h3>
    Observações
  </h3>

  <p id="pdfObservacoes"></p>


  <div class="assinatura-pdf">

    ______________________________________

    <br><br>

    Responsável pela alta

  </div>

</div>


<script>

  /* =====================================================
     VARIÁVEIS
     ===================================================== */

  let triagensCarregadas = [];

  let diagnosticoPacienteAtual = "";


  /* =====================================================
     CARREGAR PACIENTES
     ===================================================== */

  function carregar() {

    fetch("/triagens")

      .then(r => r.json())

      .then(data => {

        triagensCarregadas = data;

        const div =
          document.getElementById("triagens");

        div.innerHTML = "";

        if (data.length === 0) {

          div.innerHTML = `
            <p class="fila-vazia">
              Nenhum paciente na fila.
            </p>
          `;

          return;
        }

        data.forEach((t, index) => {

          div.innerHTML += `

            <div class="card">

              <h3>
                ${t.nome}
              </h3>

              <p>
                <b>Sintoma:</b>
                ${t.sintoma || "Não informado"}
              </p>

              <p>
                <b>Temperatura:</b>
                ${t.temperatura || "Não informada"}°C
              </p>

              <p>
                <span class="${t.risco}">
                  ${t.risco}
                </span>
              </p>

              <p>
                <b>Alergia:</b>
                ${t.alergia || "Nenhuma"}
              </p>

              <p>
                <b>Observação:</b>
                ${t.observacao || "Nenhuma"}
              </p>

              <div class="acoes-paciente">

                <button
                  onclick="selecionar(${index})"
                >
                  Atender
                </button>

                <button
                  class="btn-tv"
                  onclick="chamarNaTV('${t.nome.replace(/'/g, "\\'")}')"
                >
                  📺 Chamar na TV
                </button>

                <button
                  class="btn-alta"
                  onclick="abrirFormularioAlta(${index})"
                >
                  🏥 Dar Alta
                </button>

              </div>

            </div>

          `;

        });

      })

      .catch(error => {

        console.error(
          "Erro ao carregar triagens:",
          error
        );

      });

  }


  /* =====================================================
     CHAMAR NA TV
     ===================================================== */

  function chamarNaTV(nome) {

    const consultorio =
      document
        .getElementById("consultorio-num")
        .value || "01";

    fetch("/tv/chamar", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        localTipo: "CONSULTÓRIO",

        localNumero: consultorio,

        paciente: nome

      })

    })

    .then(r => r.json())

    .then(() => {

      alert(
        "✅ " +
        nome +
        " foi chamado na TV para o Consultório " +
        consultorio +
        "!"
      );

    })

    .catch(error => {

      console.error(error);

      alert(
        "❌ Erro ao chamar paciente na TV."
      );

    });

  }


  /* =====================================================
     SELECIONAR PACIENTE
     ===================================================== */

  function selecionar(index) {

    const t =
      triagensCarregadas[index];

    if (!t) {

      alert(
        "Paciente não encontrado."
      );

      return;
    }

    document.getElementById("paciente").value =
      t.nome;

    document.getElementById("diagnostico").value =
      t.diagnostico || "";

    diagnosticoPacienteAtual =
      t.diagnostico || "";

    document.getElementById("obs").value =
      t.observacao || "";

    if (
      t.alergia &&
      t.alergia !== "Nenhuma"
    ) {

      alert(
        "⚠️ Paciente possui alergia: " +
        t.alergia
      );

    }

  }


  /* =====================================================
     CARREGAR MEDICAÇÕES
     ===================================================== */

  function carregarMedicacoes() {

    fetch("/lista-medicacoes")

      .then(r => r.json())

      .then(data => {

        const select =
          document.getElementById("medicacao");

        select.innerHTML = `
          <option value="">
            Selecione a medicação
          </option>
        `;

        data.forEach(med => {

          const option =
            document.createElement("option");

          option.value = med;

          option.textContent = med;

          select.appendChild(option);

        });

      })

      .catch(error => {

        console.error(
          "Erro ao carregar medicações:",
          error
        );

      });

  }


  /* =====================================================
     SALVAR CONSULTA
     ===================================================== */

  function salvar() {

    const paciente =
      document
        .getElementById("paciente")
        .value;

    const diagnostico =
      document
        .getElementById("diagnostico")
        .value
        .trim();

    const medicacao =
      document
        .getElementById("medicacao")
        .value;

    const obs =
      document
        .getElementById("obs")
        .value;

    if (!paciente) {

      alert(
        "Selecione um paciente clicando em Atender."
      );

      return;
    }

    if (!diagnostico) {

      alert(
        "Informe o diagnóstico."
      );

      document
        .getElementById("diagnostico")
        .focus();

      return;
    }

    if (!medicacao) {

      alert(
        "Selecione uma medicação."
      );

      return;
    }

    diagnosticoPacienteAtual =
      diagnostico;

    fetch("/consulta", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        paciente,
        diagnostico,
        medicacao,
        obs

      })

    })

    .then(r => r.json())

    .then(() => {

      alert(
        "Consulta salva"
      );

      document.getElementById("diagnostico").value =
        "";

      document.getElementById("medicacao").value =
        "";

      document.getElementById("obs").value =
        "";

    })

    .catch(error => {

      console.error(error);

      alert(
        "❌ Erro ao salvar consulta."
      );

    });

  }


  /* =====================================================
     ABRIR FORMULÁRIO DE ALTA
     ===================================================== */

  function abrirFormularioAlta(index) {

    const paciente =
      triagensCarregadas[index];

    if (!paciente) {

      alert(
        "Paciente não encontrado."
      );

      return;
    }

    document.getElementById("altaPaciente").value =
      paciente.nome || "";

    let diagnostico =
      paciente.diagnostico || "";

    if (!diagnostico) {

      diagnostico =
        diagnosticoPacienteAtual;

    }

    if (!diagnostico) {

      diagnostico =
        document
          .getElementById("diagnostico")
          .value
          .trim();

    }

    document.getElementById("altaDiagnostico").value =
      diagnostico;

    document.getElementById("motivoAlta").value =
      "";

    document.getElementById("observacoesAlta").value =
      "";

    const hoje =
      new Date();

    const ano =
      hoje.getFullYear();

    const mes =
      String(
        hoje.getMonth() + 1
      ).padStart(2, "0");

    const dia =
      String(
        hoje.getDate()
      ).padStart(2, "0");

    document.getElementById("dataAlta").value =
      `${ano}-${mes}-${dia}`;

    document.getElementById("modalAlta").style.display =
      "flex";

    setTimeout(() => {

      document
        .getElementById("motivoAlta")
        .focus();

    }, 100);

  }


  /* =====================================================
     FECHAR FORMULÁRIO DE ALTA
     ===================================================== */

  function fecharFormularioAlta() {

    document.getElementById("modalAlta").style.display =
      "none";

  }


  /* =====================================================
     GERAR PDF
     ===================================================== */

  function gerarAltaPDF() {

    const paciente =
      document
        .getElementById("altaPaciente")
        .value
        .trim();

    const diagnostico =
      document
        .getElementById("altaDiagnostico")
        .value
        .trim();

    const motivo =
      document
        .getElementById("motivoAlta")
        .value
        .trim();

    const observacoes =
      document
        .getElementById("observacoesAlta")
        .value
        .trim();

    const data =
      document
        .getElementById("dataAlta")
        .value;

    if (!paciente) {

      alert(
        "⚠️ Paciente não informado."
      );

      return;
    }

    if (!diagnostico) {

      alert(
        "⚠️ Diagnóstico não informado."
      );

      return;
    }

    if (!motivo) {

      alert(
        "⚠️ Informe o motivo da alta."
      );

      document
        .getElementById("motivoAlta")
        .focus();

      return;
    }

    if (!data) {

      alert(
        "⚠️ Informe a data da alta."
      );

      return;
    }

    document
      .getElementById("pdfPaciente")
      .textContent =
      paciente;

    document
      .getElementById("pdfDiagnostico")
      .textContent =
      diagnostico;

    document
      .getElementById("pdfMotivo")
      .textContent =
      motivo;

    document
      .getElementById("pdfObservacoes")
      .textContent =
      observacoes ||
      "Nenhuma observação.";

    const partes =
      data.split("-");

    document
      .getElementById("pdfData")
      .textContent =
      `${partes[2]}/${partes[1]}/${partes[0]}`;

    fecharFormularioAlta();

    setTimeout(() => {

      window.print();

    }, 300);

  }


  /* =====================================================
     FECHAR MODAL CLICANDO FORA
     ===================================================== */

  document
    .getElementById("modalAlta")
    .addEventListener(
      "click",
      function(event) {

        if (event.target === this) {

          fecharFormularioAlta();

        }

      }
    );


  /* =====================================================
     FECHAR COM ESC
     ===================================================== */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        const modal =
          document.getElementById("modalAlta");

        if (
          modal.style.display === "flex"
        ) {

          fecharFormularioAlta();

        }

      }

    }
  );


  /* =====================================================
     INICIAR SISTEMA
     ===================================================== */

  carregar();

  carregarMedicacoes();


  /* =====================================================
     ATUALIZAR FILA A CADA 10 SEGUNDOS
     ===================================================== */

  setInterval(
    carregar,
    10000
  );

</script>

</body>

</html>
