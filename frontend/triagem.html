<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem Hospitalar</title>

<style>

    /* ==================================================
       RESET
    ================================================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* ==================================================
       PÁGINA
    ================================================== */

    body {
        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #eaf7ff,
                #f7fbff,
                #eaf8f4
            );

        color: #193b53;

        padding: 30px;
    }

    /* ==================================================
       CONTAINER
    ================================================== */

    .container {
        width: 100%;
        max-width: 1100px;

        margin: 0 auto;

        background: #ffffff;

        border-radius: 22px;

        padding: 30px;

        box-shadow:
            0 20px 60px
            rgba(23, 67, 91, 0.13);

        border: 1px solid #e1ebf0;
    }

    /* ==================================================
       CABEÇALHO
    ================================================== */

    .cabecalho {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 20px;

        margin-bottom: 30px;

        padding-bottom: 25px;

        border-bottom: 1px solid #e5edf2;
    }

    .cabecalho-info {
        display: flex;

        align-items: center;

        gap: 15px;
    }

    .icone {
        width: 58px;
        height: 58px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 16px;

        background:
            linear-gradient(
                135deg,
                #08a5a5,
                #167fd0
            );

        color: white;

        font-size: 28px;

        box-shadow:
            0 8px 20px
            rgba(22, 127, 208, 0.20);
    }

    .cabecalho h1 {
        font-size: 25px;

        color: #173b56;

        margin-bottom: 5px;
    }

    .cabecalho p {
        color: #8497a3;

        font-size: 14px;
    }

    /* ==================================================
       BOTÃO TV
    ================================================== */

    .btn-abrir-tv {
        border: none;

        background:
            linear-gradient(
                135deg,
                #08a5a5,
                #167fd0
            );

        color: white;

        padding: 12px 17px;

        border-radius: 10px;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .btn-abrir-tv:hover {
        transform: translateY(-2px);

        filter: brightness(1.05);
    }

    /* ==================================================
       SEÇÃO DA FILA
    ================================================== */

    .fila {
        background: #f5fbfd;

        border: 1px solid #dcebf1;

        border-radius: 16px;

        padding: 22px;

        margin-bottom: 30px;
    }

    .fila-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 20px;

        margin-bottom: 18px;
    }

    .fila-header h2 {
        font-size: 19px;

        color: #244d67;
    }

    .fila-header p {
        color: #8295a1;

        font-size: 12px;

        line-height: 1.5;

        text-align: right;
    }

    /* ==================================================
       ITEM DO PACIENTE
    ================================================== */

    .fila-item {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

        background: white;

        border: 1px solid #e0e9ee;

        border-radius: 11px;

        padding: 15px;

        margin-bottom: 9px;

        transition: 0.2s;
    }

    .fila-item:last-child {
        margin-bottom: 0;
    }

    .fila-item:hover {
        border-color: #b7d7e0;

        box-shadow:
            0 5px 18px
            rgba(20, 70, 90, 0.07);
    }

    .paciente-nome {
        display: block;

        color: #244d67;

        font-size: 15px;

        font-weight: bold;

        margin-bottom: 5px;
    }

    .paciente-detalhes {
        color: #899aa5;

        font-size: 12px;
    }

    /* ==================================================
       BOTÃO CHAMAR
    ================================================== */

    .btn-chamar {
        flex-shrink: 0;

        border: none;

        background: #19a36b;

        color: white;

        padding: 9px 14px;

        border-radius: 8px;

        font-size: 13px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .btn-chamar:hover {
        background: #138653;

        transform: translateY(-1px);
    }

    /* ==================================================
       BOTÃO ATUALIZAR
    ================================================== */

    .btn-atualizar {
        margin-top: 15px;

        padding: 8px 13px;

        border: 1px solid #d4e1e7;

        border-radius: 8px;

        background: white;

        color: #526e7d;

        font-size: 13px;

        cursor: pointer;
    }

    .btn-atualizar:hover {
        background: #eef8fa;
    }

    /* ==================================================
       FILA VAZIA
    ================================================== */

    .fila-vazia {
        padding: 25px;

        background: white;

        border: 1px dashed #d3e1e7;

        border-radius: 10px;

        text-align: center;

        color: #899aa5;

        font-size: 14px;
    }

    /* ==================================================
       DIVISOR
    ================================================== */

    .divisor {
        width: 100%;

        height: 1px;

        background: #e5edf2;

        margin: 30px 0;
    }

    /* ==================================================
       FORMULÁRIO
    ================================================== */

    .formulario h2 {
        color: #244d67;

        font-size: 20px;

        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;

        grid-template-columns:
            1fr 1fr;

        gap: 18px;
    }

    .campo {
        display: flex;

        flex-direction: column;
    }

    .campo-completo {
        grid-column: 1 / -1;
    }

    .campo label {
        color: #36566d;

        font-size: 13px;

        font-weight: bold;

        margin-bottom: 7px;
    }

    .campo input,
    .campo select,
    .campo textarea {
        width: 100%;

        border: 1px solid #d6e2e8;

        border-radius: 10px;

        background: #f9fcfd;

        color: #173b56;

        font-family: Arial, Helvetica, sans-serif;

        font-size: 14px;

        outline: none;

        transition: 0.2s;
    }

    .campo input,
    .campo select {
        height: 48px;

        padding: 0 13px;
    }

    .campo textarea {
        min-height: 115px;

        padding: 13px;

        resize: vertical;
    }

    .campo input::placeholder,
    .campo textarea::placeholder {
        color: #9aaab4;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
        background: white;

        border-color: #08a5a5;

        box-shadow:
            0 0 0 4px
            rgba(8, 165, 165, 0.10);
    }

    /* ==================================================
       RESULTADO
    ================================================== */

    #resultado {
        display: none;

        margin-top: 20px;

        padding: 16px;

        border-radius: 10px;

        text-align: center;

        font-size: 15px;

        font-weight: bold;
    }

    #resultado.verde {
        display: block;

        color: #18733d;

        background: #eaf8ef;

        border: 1px solid #bce5ca;
    }

    #resultado.amarelo {
        display: block;

        color: #906900;

        background: #fff8df;

        border: 1px solid #f0dc91;
    }

    #resultado.vermelho {
        display: block;

        color: #b52b2b;

        background: #ffeded;

        border: 1px solid #f0baba;
    }

    /* ==================================================
       BOTÃO SALVAR
    ================================================== */

    .btn-salvar {
        width: 100%;

        height: 53px;

        margin-top: 20px;

        border: none;

        border-radius: 10px;

        background:
            linear-gradient(
                135deg,
                #08a5a5,
                #167fd0
            );

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 9px 22px
            rgba(22, 127, 208, 0.20);

        transition: 0.2s;
    }

    .btn-salvar:hover {
        transform: translateY(-2px);

        filter: brightness(1.05);
    }

    /* ==================================================
       RESPONSIVO
    ================================================== */

    @media (max-width: 700px) {

        body {
            padding: 12px;
        }

        .container {
            padding: 20px;

            border-radius: 17px;
        }

        .cabecalho {
            flex-direction: column;

            align-items: stretch;
        }

        .btn-abrir-tv {
            width: 100%;
        }

        .fila-header {
            flex-direction: column;

            align-items: flex-start;
        }

        .fila-header p {
            text-align: left;
        }

        .fila-item {
            flex-direction: column;

            align-items: stretch;
        }

        .btn-chamar {
            width: 100%;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .campo-completo {
            grid-column: auto;
        }
    }

</style>

</head> <body>
<!-- ==================================================
     CONTAINER PRINCIPAL
================================================== -->

<div class="container">

    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header class="cabecalho">

        <div class="cabecalho-info">

            <div class="icone">
                🏥
            </div>

            <div>

                <h1>
                    Triagem Hospitalar
                </h1>

                <p>
                    Gerenciamento e classificação de pacientes
                </p>

            </div>

        </div>

        <button
            class="btn-abrir-tv"
            onclick="window.open('tv.html', '_blank')"
        >
            📺 Abrir Tela da TV
        </button>

    </header>

    <!-- ==================================================
         FILA DE PACIENTES
    ================================================== -->

    <section class="fila">

        <div class="fila-header">

            <h2>
                👥 Pacientes aguardando
            </h2>

            <p>
                Clique em "Chamar na TV"<br>
                para chamar ao Guichê 01
            </p>

        </div>

        <div id="fila-pacientes">

            <div class="fila-vazia">
                Carregando pacientes...
            </div>

        </div>

        <button
            class="btn-atualizar"
            onclick="carregarPacientes()"
        >
            🔄 Atualizar lista
        </button>

    </section>

    <!-- ==================================================
         DIVISOR
    ================================================== -->

    <div class="divisor"></div>

    <!-- ==================================================
         FORMULÁRIO
    ================================================== -->

    <section class="formulario">

        <h2>
            🩺 Formulário de Triagem
        </h2>

        <div class="form-grid">

            <!-- NOME -->

            <div class="campo campo-completo">

                <label for="nome">
                    Nome do paciente
                </label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Digite o nome completo do paciente"
                >

            </div>

            <!-- SINTOMA -->

            <div class="campo">

                <label for="sintoma">
                    Sintoma principal
                </label>

                <select id="sintoma">

                    <option value="">
                        Selecione o sintoma
                    </option>

                    <option value="dor_leve">
                        Dor leve
                    </option>

                    <option value="resfriado">
                        Resfriado
                    </option>

                    <option value="coriza">
                        Coriza
                    </option>

                    <option value="tosse">
                        Tosse
                    </option>

                    <option value="febre">
                        Febre
                    </option>

                    <option value="vomito">
                        Vômito
                    </option>

                    <option value="diarreia">
                        Diarreia
                    </option>

                    <option value="falta_ar_moderada">
                        Falta de ar moderada
                    </option>

                    <option value="falta_ar_grave">
                        Falta de ar grave
                    </option>

                    <option value="infarto">
                        Suspeita de infarto
                    </option>

                    <option value="avc">
                        Suspeita de AVC
                    </option>

                    <option value="convulsao">
                        Convulsão
                    </option>

                    <option value="hemorragia">
                        Hemorragia
                    </option>

                </select>

            </div>

            <!-- TEMPERATURA -->

            <div class="campo">

                <label for="temp">
                    Temperatura (°C)
                </label>

                <input
                    id="temp"
                    type="number"
                    step="0.1"
                    placeholder="Ex.: 37.5"
                >

            </div>

            <!-- ALERGIAS -->

            <div class="campo campo-completo">

                <label for="alergia">
                    Alergias
                </label>

                <input
                    id="alergia"
                    type="text"
                    placeholder="Informe alergias conhecidas"
                >

            </div>

            <!-- OBSERVAÇÕES -->

            <div class="campo campo-completo">

                <label for="observacao">
                    Observações
                </label>

                <textarea
                    id="observacao"
                    placeholder="Digite informações adicionais sobre o paciente..."
                ></textarea>

            </div>

        </div>

        <!-- ==================================================
             RESULTADO
        ================================================== -->

        <div id="resultado"></div>

        <!-- ==================================================
             SALVAR
        ================================================== -->

        <button
            class="btn-salvar"
            onclick="salvar()"
        >
            ✓ Salvar Triagem
        </button>

    </section>

</div>

<!-- ======================================================
     JAVASCRIPT
======================================================= -->

<script>

    /* ==================================================
       CARREGAR PACIENTES
    ================================================== */

    function carregarPacientes() {

        fetch("/pacientes")

            .then(function(response) {

                return response.json();

            })

            .then(function(pacientes) {

                const div =
                    document.getElementById(
                        "fila-pacientes"
                    );

                const fila =
                    pacientes.filter(function(paciente) {

                        return paciente.status === "triagem";

                    });

                if (fila.length === 0) {

                    div.innerHTML = `
                        <div class="fila-vazia">
                            ✓ Nenhum paciente aguardando no momento.
                        </div>
                    `;

                    return;
                }

                div.innerHTML = "";

                fila.forEach(function(paciente) {

                    const item =
                        document.createElement("div");

                    item.className =
                        "fila-item";

                    const informacoes =
                        document.createElement("div");

                    const nome =
                        document.createElement("span");

                    nome.className =
                        "paciente-nome";

                    nome.textContent =
                        paciente.nome;

                    const detalhes =
                        document.createElement("span");

                    detalhes.className =
                        "paciente-detalhes";

                    detalhes.textContent =
                        "CPF: " +
                        (paciente.cpf || "—") +
                        " | Tipo: " +
                        (paciente.tipo || "—");

                    informacoes.appendChild(nome);

                    informacoes.appendChild(detalhes);

                    const botao =
                        document.createElement("button");

                    botao.className =
                        "btn-chamar";

                    botao.textContent =
                        "📺 Chamar na TV";

                    botao.onclick =
                        function() {

                            chamarNaTV(
                                paciente.nome
                            );

                        };

                    item.appendChild(
                        informacoes
                    );

                    item.appendChild(
                        botao
                    );

                    div.appendChild(
                        item
                    );

                });

            })

            .catch(function() {

                document.getElementById(
                    "fila-pacientes"
                ).innerHTML = `

                    <div
                        class="fila-vazia"
                        style="color:#c0392b;"
                    >
                        ⚠ Erro ao carregar pacientes.
                    </div>

                `;

            });

    }

    /* ==================================================
       CHAMAR PACIENTE NA TV
    ================================================== */

    function chamarNaTV(nome) {

        fetch("/tv/chamar", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                localTipo: "GUICHÊ",

                localNumero: "01",

                paciente: nome

            })

        })

        .then(function(response) {

            return response.json();

        })

        .then(function() {

            alert(
                "✅ " +
                nome +
                " foi chamado na TV para o Guichê 01!"
            );

        })

        .catch(function() {

            alert(
                "❌ Erro ao chamar o paciente na TV."
            );

        });

    }

    /* ==================================================
       CLASSIFICAÇÃO DE RISCO
    ================================================== */

    function classificarRisco(
        sintoma,
        temperatura
    ) {

        const vermelhos = [

            "infarto",
            "avc",
            "convulsao",
            "hemorragia",
            "falta_ar_grave"

        ];

        const amarelos = [

            "febre",
            "vomito",
            "diarreia",
            "falta_ar_moderada"

        ];

        if (temperatura >= 39) {

            return "vermelho";

        }

        if (vermelhos.includes(sintoma)) {

            return "vermelho";

        }

        if (amarelos.includes(sintoma)) {

            return "amarelo";

        }

        return "verde";

    }

    /* ==================================================
       SALVAR TRIAGEM
    ================================================== */

    function salvar() {

        const nome =
            document.getElementById(
                "nome"
            ).value.trim();

        const sintoma =
            document.getElementById(
                "sintoma"
            ).value;

        const temperatura =
            Number(
                document.getElementById(
                    "temp"
                ).value
            );

        const alergia =
            document.getElementById(
                "alergia"
            ).value.trim();

        const observacao =
            document.getElementById(
                "observacao"
            ).value.trim();

        /* ----------------------------------------------
           VALIDAÇÃO
        ---------------------------------------------- */

        if (!nome) {

            alert(
                "Informe o nome do paciente."
            );

            return;
        }

        if (!sintoma) {

            alert(
                "Selecione o sintoma."
            );

            return;
        }

        /* ----------------------------------------------
           CLASSIFICAÇÃO
        ---------------------------------------------- */

        const risco =
            classificarRisco(
                sintoma,
                temperatura
            );

        /* ----------------------------------------------
           ENVIO PARA O SERVIDOR
        ---------------------------------------------- */

        fetch("/triagem", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

                nome: nome,

                sintoma: sintoma,

                temperatura: temperatura,

                alergia: alergia,

                observacao: observacao,

                risco: risco

            })

        })

        .then(function(response) {

            return response.json();

        })

        .then(function() {

            const resultado =
                document.getElementById(
                    "resultado"
                );

            resultado.className =
                risco;

            resultado.innerHTML =
                "Classificação: " +
                risco.toUpperCase();

            alert(
                "✅ Triagem salva com sucesso!"
            );

            /* ------------------------------------------
               LIMPAR FORMULÁRIO
            ------------------------------------------ */

            document.getElementById(
                "nome"
            ).value = "";

            document.getElementById(
                "sintoma"
            ).value = "";

            document.getElementById(
                "temp"
            ).value = "";

            document.getElementById(
                "alergia"
            ).value = "";

            document.getElementById(
                "observacao"
            ).value = "";

            /* ------------------------------------------
               ATUALIZAR FILA
            ------------------------------------------ */

            carregarPacientes();

        })

        .catch(function(error) {

            console.error(error);

            alert(
                "❌ Erro ao salvar a triagem."
            );

        });

    }

    /* ==================================================
       CARREGAR FILA AO ABRIR A PÁGINA
    ================================================== */

    carregarPacientes();

    /* ==================================================
       ATUALIZAR FILA A CADA 10 SEGUNDOS
    ================================================== */

    setInterval(
        carregarPacientes,
        10000
    );

</script>

</body> </html>
