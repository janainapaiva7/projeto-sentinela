<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema Hospitalar</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="container login-container">

        <div class="logo">
            ✚
        </div>

        <h1>
            Sistema Hospitalar
        </h1>

        <p class="subtitle">
            Acesso ao sistema
        </p>

        <div class="input-box">

            <label for="usuario">
                Usuário
            </label>

            <input
                id="usuario"
                type="text"
                placeholder="Digite seu usuário"
                autocomplete="username"
            >

        </div>

        <div class="input-box">

            <label for="senha">
                Senha
            </label>

            <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

        </div>

        <button onclick="login()">

            <span>
                Entrar
            </span>

            <span class="arrow">
                →
            </span>

        </button>

        <p id="erro"></p>

        <div class="security">
            🔒 Ambiente seguro e protegido
        </div>

    </div>

    <script>

        function login() {

            const usuario =
                document.getElementById("usuario").value;

            const senha =
                document.getElementById("senha").value;

            const erro =
                document.getElementById("erro");

            erro.textContent = "";

            fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usuario: usuario,
                    senha: senha
                })

            })

            .then(response => response.json())

            .then(data => {

                if (data.tipo === "triagem") {

                    location.href = "triagem.html";

                }

                else if (data.tipo === "medico") {

                    location.href = "medico.html";

                }

                else if (data.tipo === "atendimento") {

                    location.href = "atendimento.html";

                }

                else {

                    erro.textContent =
                        "Usuário ou senha inválidos.";

                }

            })

            .catch(error => {

                console.error(error);

                erro.textContent =
                    "Erro ao conectar ao servidor.";

            });

        }

    </script>

</body>

</html>
