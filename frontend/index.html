<!DOCTYPE html> <html lang="pt-BR"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sistema Hospitalar</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            radial-gradient(
                circle at 10% 10%,
                rgba(14, 165, 164, 0.20),
                transparent 30%
            ),
            radial-gradient(
                circle at 90% 90%,
                rgba(30, 136, 229, 0.18),
                transparent 30%
            ),
            linear-gradient(
                135deg,
                #eaf8ff,
                #f8fcff,
                #eafaf7
            );
    }

    /* CARTÃO */

    .container {
        width: 100%;
        max-width: 430px;

        padding: 45px 40px;

        background: rgba(255, 255, 255, 0.96);

        border-radius: 24px;

        border: 1px solid #e5eef3;

        box-shadow:
            0 25px 70px rgba(25, 75, 100, 0.15);

        text-align: center;

        animation: aparecer 0.5s ease;
    }

    /* LOGO */

    .logo {
        width: 76px;
        height: 76px;

        margin: 0 auto 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 22px;

        background:
            linear-gradient(
                135deg,
                #08a6a6,
                #167bd4
            );

        color: white;

        font-size: 42px;
        font-weight: bold;

        box-shadow:
            0 12px 28px rgba(14, 150, 170, 0.25);
    }

    /* TÍTULO */

    h1 {
        color: #173b56;

        font-size: 28px;

        margin-bottom: 8px;
    }

    .subtitle {
        color: #7d909e;

        font-size: 15px;

        margin-bottom: 32px;
    }

    /* CAMPOS */

    .input-box {
        text-align: left;

        margin-bottom: 20px;
    }

    .input-box label {
        display: block;

        margin-bottom: 8px;

        color: #36566d;

        font-size: 14px;

        font-weight: bold;
    }

    .input-box input {
        width: 100%;

        height: 53px;

        padding: 0 16px;

        border: 1px solid #d5e1e8;

        border-radius: 12px;

        outline: none;

        background: #f8fbfd;

        color: #173b56;

        font-size: 15px;

        transition: 0.2s;
    }

    .input-box input::placeholder {
        color: #9aabb7;
    }

    .input-box input:focus {
        background: white;

        border-color: #0da5a4;

        box-shadow:
            0 0 0 4px
            rgba(13, 165, 164, 0.12);
    }

    /* BOTÃO */

    button {
        width: 100%;

        height: 54px;

        margin-top: 4px;

        border: none;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #0ba5a4,
                #147fd0
            );

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 12px;

        box-shadow:
            0 10px 24px
            rgba(20, 127, 208, 0.22);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            filter 0.2s ease;
    }

    button:hover {
        transform: translateY(-2px);

        filter: brightness(1.05);

        box-shadow:
            0 15px 30px
            rgba(20, 127, 208, 0.28);
    }

    button:active {
        transform: translateY(0);
    }

    .arrow {
        font-size: 21px;

        transition: 0.2s;
    }

    button:hover .arrow {
        transform: translateX(5px);
    }

    /* MENSAGEM DE ERRO */

    #erro {
        min-height: 20px;

        margin-top: 15px;

        color: #dc3545;

        font-size: 14px;

        font-weight: bold;
    }

    /* RODAPÉ */

    .security {
        margin-top: 25px;

        color: #8b9ba7;

        font-size: 12px;
    }

    /* ANIMAÇÃO */

    @keyframes aparecer {

        from {
            opacity: 0;

            transform:
                translateY(20px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);
        }

    }

    /* CELULAR */

    @media (max-width: 480px) {

        body {
            padding: 15px;
        }

        .container {
            padding: 35px 25px;

            border-radius: 20px;
        }

        .logo {
            width: 65px;
            height: 65px;

            font-size: 36px;
        }

        h1 {
            font-size: 24px;
        }

    }

</style>

</head> <body>
<div class="container">

    <div class="logo">
        ✚
    </div>

    <h1>
        Sistema Hospitalar
    </h1>

    <p class="subtitle">
        Acesso ao sistema
    </p>


    <div class="input-box">

        <label for="usuario">
            Usuário
        </label>

        <input
            id="usuario"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
        >

    </div>


    <div class="input-box">

        <label for="senha">
            Senha
        </label>

        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
        >

    </div>


    <button onclick="login()">

        <span>
            Entrar
        </span>

        <span class="arrow">
            →
        </span>

    </button>


    <p id="erro"></p>


    <div class="security">
        🔒 Ambiente seguro e protegido
    </div>

</div>


<script>

    function login() {

        const usuario =
            document.getElementById("usuario").value;

        const senha =
            document.getElementById("senha").value;

        const erro =
            document.getElementById("erro");


        erro.textContent = "";


        fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                usuario: usuario,

                senha: senha

            })

        })

        .then(response => response.json())

        .then(data => {

            if (data.tipo === "triagem") {

                location.href = "triagem.html";

            }

            else if (data.tipo === "medico") {

                location.href = "medico.html";

            }

            else if (data.tipo === "atendimento") {

                location.href = "atendimento.html";

            }

            else {

                erro.textContent =
                    "Usuário ou senha inválidos.";

            }

        })

        .catch(error => {

            console.error(error);

            erro.textContent =
                "Erro ao conectar ao servidor.";

        });

    }

</script>

</body> </html>
