<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Médica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="medico-page">
  <div class="container">
    <header class="topo">
      <div class="titulo-area">
        <div class="icone-medico">✚</div>
        <div>
          <h1>Consulta Médica</h1>
          <div class="subtitulo">Registro do atendimento</div>
        </div>
      </div>
      <button class="btn-tv-topo" type="button" onclick="window.location.href='medico.html'">Voltar à página inicial</button>
    </header>

<section>

    <div class="secao-titulo">

      <div class="linha-titulo"></div>

      <h2>Consulta atual</h2>

    </div>


    <div class="consulta-box">

      <div class="consulta-grid">

        <div class="campo campo-completo">

          <label for="paciente">
            Paciente
          </label>

          <input
            id="paciente"
            placeholder="Selecione um paciente na fila"
            readonly>

        </div>


        <div class="campo">

          <label for="diagnostico">
            Diagnóstico
          </label>

          <input
            id="diagnostico"
            placeholder="Informe o diagnóstico">

        </div>


        <div class="campo">

          <label for="medicacao">
            Medicação
          </label>

          <select id="medicacao">

            <option value="">
              Selecione a medicação
            </option>

          </select>

        </div>


        <div class="campo campo-completo">

          <label for="obs">
            Observações
          </label>

          <textarea
            id="obs"
            placeholder="Registre observações sobre o atendimento..."></textarea>

        </div>

      </div>


      <div class="consulta-footer">

        <button
          class="btn-salvar"
          onclick="salvar()">

          Finalizar consulta

        </button>

      </div>

    </div>

  </section>
  </div>

<script>
function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => {
      if (!r.ok) throw new Error("Erro HTTP " + r.status);
      return r.json();
    })
    .then(data => {
      const select = document.getElementById("medicacao");
      select.innerHTML = '<option value="">Selecione a medicação</option>';
      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    })
    .catch(error => console.error("Erro ao carregar medicações:", error));
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) {
    alert("Volte à página inicial e selecione um paciente clicando em Atender.");
    return;
  }
  if (!medicacao) {
    alert("Selecione uma medicação.");
    return;
  }

  fetch("/consulta", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paciente, diagnostico, medicacao, obs })
  })
  .then(r => {
    if (!r.ok) throw new Error("Erro HTTP " + r.status);
    return r.json();
  })
  .then(() => {
    alert("Consulta salva com sucesso.");
    sessionStorage.removeItem("medicoPacienteSelecionado");
    sessionStorage.removeItem("medicoObservacaoSelecionada");
    document.getElementById("paciente").value = "";
    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
    window.location.href = "medico.html";
  })
  .catch(error => {
    console.error("Erro ao salvar consulta:", error);
    alert("Não foi possível salvar a consulta.");
  });
}

const pacienteSelecionado = sessionStorage.getItem("medicoPacienteSelecionado") || "";
document.getElementById("paciente").value = pacienteSelecionado;
document.getElementById("obs").value = sessionStorage.getItem("medicoObservacaoSelecionada") || "";
if (!pacienteSelecionado) {
  document.getElementById("paciente").placeholder = "Volte à página inicial e selecione um paciente";
}
carregarMedicacoes();
</script>
</body>
</html>
